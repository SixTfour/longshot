[project]
name = "longshot"
version = "0.1.0"
description = "Discord bot that runs a fantasy football league's weekly parlay"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4,<3",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["longshot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
